name: Publish Tagged Android Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable release tag to publish
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Resolve requested tag
        id: requested
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_TAG: ${{ github.ref_name }}
        run: |
          TAG="${INPUT_TAG:-$REF_TAG}"
          case "$TAG" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "::error::Invalid release tag: $TAG"; exit 2 ;; esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.requested.outputs.tag }}
          fetch-depth: 0
      - name: Verify immutable tag and release identity
        env:
          TAG: ${{ steps.requested.outputs.tag }}
        run: |
          git fetch origin --tags
          test "$(git cat-file -t "$TAG")" = tag
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$TAG^{}")"
          python3 scripts/release_tool.py validate --tag "$TAG" --skip-branch --allow-existing-tag
      - name: Detect complete release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.requested.outputs.tag }}
        run: |
          mkdir -p release-artifacts
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release download "$TAG" --dir release-artifacts
            (cd release-artifacts && sha256sum --check SHA256SUMS)
            echo "complete=true" >> "$GITHUB_OUTPUT"
          else
            echo "complete=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-java@v4
        if: steps.existing.outputs.complete != 'true'
        with:
          distribution: temurin
          java-version: "17"
      - name: Configure Android SDK
        if: steps.existing.outputs.complete != 'true'
        run: |
          ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o "$RUNNER_TEMP/cmdline-tools.zip"
            unzip -q "$RUNNER_TEMP/cmdline-tools.zip" -d "$RUNNER_TEMP/cmdline-tools"
            mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
            cp -R "$RUNNER_TEMP/cmdline-tools/cmdline-tools/." "$ANDROID_HOME/cmdline-tools/latest/"
          fi
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          (set +o pipefail; yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null)
      - name: Install Android SDK packages
        if: steps.existing.outputs.complete != 'true'
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        if: steps.existing.outputs.complete != 'true'
      - name: Validate signing secrets
        if: steps.existing.outputs.complete != 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then echo "::error::$name is required"; missing=1; fi
          done
          exit "$missing"
      - name: Decode release keystore
        if: steps.existing.outputs.complete != 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          KEYSTORE="$RUNNER_TEMP/gitsy-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          echo "RELEASE_STORE_FILE=$KEYSTORE" >> "$GITHUB_ENV"
      - name: Build signed APK and AAB
        if: steps.existing.outputs.complete != 'true'
        run: |
          trap 'rm -f local.properties' EXIT
          printf 'sdk.dir=%s\nRELEASE_STORE_FILE=%s\nRELEASE_STORE_PASSWORD=%s\nRELEASE_KEY_ALIAS=%s\nRELEASE_KEY_PASSWORD=%s\n' \
            "$ANDROID_HOME" "$RELEASE_STORE_FILE" "$RELEASE_STORE_PASSWORD" "$RELEASE_KEY_ALIAS" "$RELEASE_KEY_PASSWORD" > local.properties
          ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon
          VERSION=$(python3 scripts/release_tool.py metadata | python3 -c 'import json,sys; print(json.load(sys.stdin)["versionName"])')
          cp app/build/outputs/apk/release/app-release.apk "release-artifacts/gitsy-$VERSION.apk"
          cp app/build/outputs/bundle/release/app-release.aab "release-artifacts/gitsy-$VERSION.aab"
          (cd release-artifacts && sha256sum "gitsy-$VERSION.apk" "gitsy-$VERSION.aab" > SHA256SUMS && sha256sum --check SHA256SUMS)
      - name: Publish GitHub Release
        if: steps.existing.outputs.complete != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.requested.outputs.tag }}
        run: |
          NOTES=$(python3 scripts/release_tool.py metadata | python3 -c 'import json,sys; print(json.load(sys.stdin)["englishNotes"])')
          gh release create "$TAG" release-artifacts/* --verify-tag --title "GitSy $TAG" --notes-file "$NOTES"
