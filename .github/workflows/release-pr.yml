name: Validate Android Release PR

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  validate:
    if: startsWith(github.head_ref, 'release/') || startsWith(github.head_ref, 'hotfix/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Configure Android SDK
        run: |
          ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o "$RUNNER_TEMP/cmdline-tools.zip"
            unzip -q "$RUNNER_TEMP/cmdline-tools.zip" -d "$RUNNER_TEMP/cmdline-tools"
            mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
            cp -R "$RUNNER_TEMP/cmdline-tools/cmdline-tools/." "$ANDROID_HOME/cmdline-tools/latest/"
          fi
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          (set +o pipefail; yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null)
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate release metadata
        run: |
          python3 scripts/release_tool.py validate
          python3 -m unittest scripts/test_release_tool.py
      - name: Build release artifacts
        run: ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon
      - name: Verify release artifact identity
        run: |
          VERSION=$(python3 scripts/release_tool.py metadata | python3 -c 'import json,sys; print(json.load(sys.stdin)["versionName"])')
          python3 - "$VERSION" <<'PY'
          import json, pathlib, sys
          data = json.loads(pathlib.Path("app/build/outputs/apk/release/output-metadata.json").read_text())
          assert data["elements"][0]["versionName"] == sys.argv[1]
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-pr-validation
          path: |
            app/build/reports/
            app/build/outputs/apk/release/
            app/build/outputs/bundle/release/
          retention-days: 14
