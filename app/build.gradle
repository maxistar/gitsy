plugins {
    id 'com.android.application'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}

def releaseProperty = { String name ->
    def value = project.findProperty(name) ?: localProperties.getProperty(name)
    value?.toString()?.trim()
}

def releaseStoreFile = releaseProperty('RELEASE_STORE_FILE')
def releaseStorePassword = releaseProperty('RELEASE_STORE_PASSWORD')
def releaseKeyAlias = releaseProperty('RELEASE_KEY_ALIAS')
def releaseKeyPassword = releaseProperty('RELEASE_KEY_PASSWORD')
def hasReleaseSigning = releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

android {
    namespace 'me.maxistar.gitsy'
    compileSdk 36

    defaultConfig {
        applicationId "me.maxistar.gitsy"
        minSdk 24
        targetSdk 36
        versionCode 5
        versionName "0.1.0"

        testInstrumentationRunner "me.maxistar.gitsy.TestRunner"
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    packagingOptions {
        resources.excludes += [
                'plugin.properties',
                'META-INF/DEPENDENCIES',
                'META-INF/versions/**/OSGI-INF/MANIFEST.MF'
        ]
    }
}


dependencies {

    implementation 'androidx.appcompat:appcompat:1.5.0'
    implementation 'com.google.android.material:material:1.5.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.3'
    implementation 'org.eclipse.jgit:org.eclipse.jgit:5.13.0.202109080827-r'
    implementation('org.eclipse.jgit:org.eclipse.jgit.ssh.jsch:5.13.0.202109080827-r') {
        exclude group: 'com.jcraft', module: 'jsch'
    }
    implementation 'com.github.mwiede:jsch:2.28.6'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.85'
    implementation 'com.google.code.gson:gson:2.10'
    implementation 'androidx.documentfile:documentfile:1.0.1'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.apache.sshd:sshd-core:2.7.0'
    testImplementation 'org.apache.sshd:sshd-common:2.7.0'
    testImplementation 'net.i2p.crypto:eddsa:0.3.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:core:1.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
